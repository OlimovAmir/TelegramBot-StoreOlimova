name: Build and Push Docker Image

on:
  push:
    branches:
      - master  # Указываем ветку, на которую будут реагировать изменения

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # Клонируем репозиторий

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2  # Настройка Buildx для сборки

      - name: Cache Docker layers
        uses: actions/cache@v3  # Используем actions/cache для кэширования слоев Docker
        with:
          path: |
            ~/.docker/buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # Используем имя пользователя Docker Hub
          password: ${{ secrets.DOCKER_PASSWORD }}  # Используем токен доступа

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/telegrambot_storeolimova:latest  # Указываем имя пользователя и имя образа

      - name: Deploy
        run: echo "Deploy your application here"  # Добавьте сюда шаги для развертывания, если необходимо
